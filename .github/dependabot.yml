# Dependabot: bundle every update into as few pull requests as possible.
# GitHub tracks version and security updates separately, so each ecosystem gets
# one "all-*" group per update type and the open-PR limit is capped at 1.
version: 2
updates:
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
      open-pull-requests-limit: 1
      commit-message:
          prefix: "chore(deps)"
      labels:
          - "dependencies"
      groups:
          all-dependencies:
              applies-to: version-updates
              patterns:
                  - "*"
          all-security-updates:
              applies-to: security-updates
              patterns:
                  - "*"
      assignees:
          - "zpt0"
      ignore:
          # Newer @vencord/discord-types versions pin an exact @types/react peer
          # (e.g. 19.2.3), which conflicts with the root's ^19.3.0 and breaks
          # `npm ci`. Re-enable once upstream accepts the current @types/react.
          - dependency-name: "@vencord/discord-types"
          # typescript-eslint's peer range is `typescript >=4.8.4 <6.1.0`, so a
          # TypeScript 7 major bump would only produce a red CI run.
          - dependency-name: "typescript"
            update-types:
                - "version-update:semver-major"

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
      open-pull-requests-limit: 1
      commit-message:
          prefix: "chore(deps)"
      labels:
          - "dependencies"
      groups:
          all-actions:
              patterns:
                  - "*"
      assignees:
          - "zpt0"
