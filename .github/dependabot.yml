version: 2
updates:
    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
      labels:
          - "dependencies"
      assignees:
          - "zpt0"
      open-pull-requests-limit: 1
      groups:
          all-dependencies:
              update-types:
                  - "major"
                  - "minor"
                  - "patch"
              patterns:
                  - "*"
